<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Shopno Puron Limited</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#06145c;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

h1{
    color:#06145c;
}

input{
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    width:95%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0066ff;
    color:white;
    font-size:18px;
}

a{
    display:block;
    margin-top:15px;
}
</style>

</head>

<body>

<div class="login-box">

<h1>🔐 Login</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<a href="register.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>

</div>

</body>
